# truck.liner0211.online — 宝塔 8.0 完整 server 块参考
# 用法：宝塔 → 网站 → truck.liner0211.online → 设置 → 配置文件
# 用下面 server { ... } 整体替换现有 server 块（保留你面板里的证书路径即可）

server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name truck.liner0211.online;
    index index.php index.html index.htm default.php default.htm default.html;

    # ★ 必须指向 public（或在面板「网站目录」把运行目录设为 /public）
    root /www/wwwroot/truck.liner0211.online/public;

    # ★ 附件上传上限
    client_max_body_size 25m;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/truck.liner0211.online.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    #error_page 404/404.html;
    if ($server_port !~ 443){
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    ssl_certificate    /www/server/panel/vhost/cert/truck.liner0211.online/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/truck.liner0211.online/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    error_page 497  https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START
    error_page 404 /404.html;
    #ERROR-PAGE-END

    # ★ WebSocket 实时通道（本机 node ws/server.js，见 ws/start_ws.sh）
    location ^~ /ws {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ★ API / 管理后台路由必须走 index.php（优先级高于下方静态图片规则）
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /admin/ {
        try_files $uri /index.php?$query_string;
    }

    # ★ 所有其他请求
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    #PHP-INFO-START  ★ 展开 enable-php-80 并加上 Authorization（App 登录必需）
    location ~ [^/]\.php(/|$)
    {
        try_files $uri =404;
        fastcgi_pass unix:/tmp/php-cgi-80.sock;
        fastcgi_index index.php;
        include fastcgi.conf;
        include pathinfo.conf;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }
    #PHP-INFO-END

    # 若保留面板 rewrite 引用，文件内容应为空或不再定义 location /
    # include /www/server/panel/vhost/rewrite/truck.liner0211.online.conf;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    location ~ \.well-known{
        allow all;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        # 仅缓存站点根下真实静态图；/api/、/admin/ 附件由 PHP 处理（勿删上方 ^~ /api/ 规则）
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/truck.liner0211.online.log;
    error_log  /www/wwwlogs/truck.liner0211.online.error.log;
}
