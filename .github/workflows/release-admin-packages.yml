name: Release Admin Packages

# 管理端：Android APK + iOS IPA + Linux / Windows 桌面包（仅 CI 编译）
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "admin_app/**"
      - "shared/truck_ledger_editor/**"
      - ".github/workflows/release-admin-packages.yml"
      - "scripts/flutter_build_version_env.sh"

permissions:
  contents: write

env:
  FLUTTER_APP_ROOT: admin_app

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version_name: ${{ steps.ver.outputs.name }}
      version_code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          source ./scripts/flutter_build_version_env.sh
          echo "name=$APP_BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$APP_BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Pub Get
        working-directory: admin_app
        run: flutter pub get

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No keystore secret; admin APK will use debug signing."
            exit 0
          fi
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/upload-keystore.jks
          {
            echo "storePassword=${ANDROID_STORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=../keystore/upload-keystore.jks"
          } > android/key.properties
          # admin_app 会回读仓库根 android/key.properties
          echo "Release signing configured for admin (shared keystore)."

      - name: Build Admin APK
        working-directory: admin_app
        run: |
          set -euo pipefail
          source ../scripts/flutter_build_version_env.sh
          flutter build apk --release \
            --build-name="$APP_BUILD_NAME" \
            --build-number="$APP_BUILD_NUMBER"
          mkdir -p ../dist-admin
          cp -f build/app/outputs/flutter-apk/app-release.apk \
            "../dist-admin/truckledger-admin-${APP_BUILD_NAME}-${APP_BUILD_NUMBER}-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: admin-android-apk
          path: dist-admin/*.apk
          retention-days: 30

  build-ios:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pub Get
        working-directory: admin_app
        run: flutter pub get

      - name: Build iOS (no codesign) + IPA
        working-directory: admin_app
        run: |
          set -euo pipefail
          source ../scripts/flutter_build_version_env.sh
          flutter build ios --release --no-codesign \
            --build-name="$APP_BUILD_NAME" \
            --build-number="$APP_BUILD_NUMBER"
          test -d build/ios/iphoneos/Runner.app
          rm -rf ipa-out
          mkdir -p ipa-out/Payload
          cp -a build/ios/iphoneos/Runner.app ipa-out/Payload/
          (
            cd ipa-out
            zip -qry "truckledger-admin-${APP_BUILD_NAME}-${APP_BUILD_NUMBER}.ipa" Payload
          )
          mkdir -p ../dist-admin
          cp -f "ipa-out/truckledger-admin-${APP_BUILD_NAME}-${APP_BUILD_NUMBER}.ipa" ../dist-admin/

      - uses: actions/upload-artifact@v4
        with:
          name: admin-ios-ipa
          path: dist-admin/*.ipa
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Linux
        working-directory: admin_app
        run: |
          set -euo pipefail
          source ../scripts/flutter_build_version_env.sh
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release \
            --build-name="$APP_BUILD_NAME" \
            --build-number="$APP_BUILD_NUMBER"
          mkdir -p ../dist-admin
          ARCHIVE="truckledger-admin-${APP_BUILD_NAME}-${APP_BUILD_NUMBER}-linux-x64.tar.gz"
          tar -C build/linux/x64/release/bundle -czf "../dist-admin/${ARCHIVE}" .

      - uses: actions/upload-artifact@v4
        with:
          name: admin-linux
          path: dist-admin/*.tar.gz
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows
        working-directory: admin_app
        shell: bash
        run: |
          set -euo pipefail
          source ../scripts/flutter_build_version_env.sh
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release \
            --build-name="$APP_BUILD_NAME" \
            --build-number="$APP_BUILD_NUMBER"
          mkdir -p ../dist-admin
          ARCHIVE="truckledger-admin-${APP_BUILD_NAME}-${APP_BUILD_NUMBER}-windows-x64.zip"
          RELEASE_DIR="$(find build/windows -type d -path '*/runner/Release' | head -1)"
          test -n "$RELEASE_DIR"
          powershell.exe -NoProfile -Command \
            "Compress-Archive -Path '$RELEASE_DIR\\*' -DestinationPath '$GITHUB_WORKSPACE\\dist-admin\\${ARCHIVE}' -Force"

      - uses: actions/upload-artifact@v4
        with:
          name: admin-windows
          path: dist-admin/*.zip
          retention-days: 30

  github-release:
    needs: [build-android, build-ios, build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: admin-*
          merge-multiple: true

      - name: Prepare release
        id: meta
        run: |
          set -euo pipefail
          source ./scripts/flutter_build_version_env.sh
          TAG="admin-v${APP_BUILD_NAME}-${APP_BUILD_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # 标题带「卡车记账」，便于在 Releases 列表里一眼看到
          echo "name=卡车记账 · 管理端 ${APP_BUILD_NAME} (${APP_BUILD_NUMBER})" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "## 卡车记账 · 管理端 ${APP_BUILD_NAME}+${APP_BUILD_NUMBER}"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Android APK"
            echo "- iOS IPA（未签名）"
            echo "- Linux x64 tar.gz"
            echo "- Windows x64 zip（PC）"
            echo ""
            echo "产物同时会挂到当前主 App 的 Latest Release，便于在 Releases 首页看到。"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          find release-assets -mindepth 2 -type f -exec mv -t release-assets/ {} + 2>/dev/null || true
          find release-assets -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          find release-assets -type f -ls
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -ge 1

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.body }}
          draft: false
          prerelease: false
          make_latest: false
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Also attach to latest main App Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 找到非 admin 的最新主 App Release，把管理端四平台包挂上去（Releases 首页可见）
          MAIN_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
            --json tagName,isDraft,isPrerelease \
            --jq '[.[] | select((.isDraft|not) and (.isPrerelease|not) and (.tagName|startswith("admin-")|not))][0].tagName')"
          if [[ -z "${MAIN_TAG:-}" || "$MAIN_TAG" == "null" ]]; then
            echo "未找到主 App Release，跳过挂载。"
            exit 0
          fi
          echo "Attaching admin assets to main release: $MAIN_TAG"
          gh release upload "$MAIN_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$MAIN_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

  publish-downloads:
    needs: [build-android, build-ios, build-linux, build-windows, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: admin-*
          merge-multiple: true

      - name: Upload admin packages to server downloads
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_SSH_KEY:-}" ] || [ -z "${SERVER_HOST:-}" ]; then
            echo "跳过服务器 uploads（缺少 SSH 配置）"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SERVER_HOST="$(printf '%s' "${SERVER_HOST:-}" | tr -d '\r\n')"
          USER="$(printf '%s' "${SERVER_USER:-root}" | tr -d '\r\n')"
          PORT="$(printf '%s' "${SERVER_PORT:-22}" | tr -d '\r\n')"
          PATH_ROOT="$(printf '%s' "${SERVER_PATH:-/www/wwwroot/truck.liner0211.online}" | tr -d '\r\n')"
          SSH=(ssh -i "$HOME/.ssh/deploy_key" -p "$PORT" -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i "$HOME/.ssh/deploy_key" -P "$PORT" -o StrictHostKeyChecking=accept-new)
          "${SSH[@]}" "${USER}@${SERVER_HOST}" "mkdir -p '${PATH_ROOT}/public/downloads'"

          APK=$(find release-assets -name '*.apk' | head -1 || true)
          IPA=$(find release-assets -name '*.ipa' | head -1 || true)
          LIN=$(find release-assets -name '*linux*.tar.gz' | head -1 || true)
          WIN=$(find release-assets -name '*windows*.zip' | head -1 || true)

          [[ -n "$APK" ]] && "${SCP[@]}" "$APK" "${USER}@${SERVER_HOST}:${PATH_ROOT}/public/downloads/truckledger-admin-latest.apk"
          [[ -n "$IPA" ]] && "${SCP[@]}" "$IPA" "${USER}@${SERVER_HOST}:${PATH_ROOT}/public/downloads/truckledger-admin-latest.ipa"
          [[ -n "$LIN" ]] && "${SCP[@]}" "$LIN" "${USER}@${SERVER_HOST}:${PATH_ROOT}/public/downloads/truckledger-admin-latest-linux-x64.tar.gz"
          [[ -n "$WIN" ]] && "${SCP[@]}" "$WIN" "${USER}@${SERVER_HOST}:${PATH_ROOT}/public/downloads/truckledger-admin-latest-windows-x64.zip"

          "${SSH[@]}" "${USER}@${SERVER_HOST}" "if id www >/dev/null 2>&1; then chown -R www:www '${PATH_ROOT}/public/downloads' || true; chmod -R a+rX '${PATH_ROOT}/public/downloads' || true; fi"
          echo "Admin packages uploaded."

      - name: Publish admin version to control plane
        env:
          CI_PUBLISH_TOKEN: ${{ secrets.CI_PUBLISH_TOKEN }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          SERVER_PUBLIC_BASE: ${{ secrets.SERVER_PUBLIC_BASE }}
        run: |
          set -euo pipefail
          if [ -z "${CI_PUBLISH_TOKEN:-}" ]; then
            echo "跳过控制面回写（缺少 CI_PUBLISH_TOKEN）"
            exit 0
          fi
          # 优先 PUBLIC_BASE_URL；兼容旧 Secret SERVER_PUBLIC_BASE
          BASE="${PUBLIC_BASE_URL:-${SERVER_PUBLIC_BASE:-https://truck.liner0211.online}}"
          BASE="${BASE%/}"
          VER="1.0.0+${{ github.run_number }}"
          APK=$(find release-assets -name '*.apk' | head -1 || true)
          if [[ "$APK" =~ truckledger-admin-([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+) ]]; then
            VER="${BASH_REMATCH[1]}+${BASH_REMATCH[2]}"
          fi
          BODY=$(printf '%s' "{\"admin_latest_version\":\"$VER\",\"admin_apk_download_url\":\"$BASE/downloads/truckledger-admin-latest.apk\",\"admin_ios_download_url\":\"$BASE/downloads/truckledger-admin-latest.ipa\",\"admin_linux_download_url\":\"$BASE/downloads/truckledger-admin-latest-linux-x64.tar.gz\",\"admin_windows_download_url\":\"$BASE/downloads/truckledger-admin-latest-windows-x64.zip\",\"admin_update_release_notes\":\"admin release $VER\"}")
          curl -fsS -X POST "$BASE/api/ci/publish-admin-release" \
            -H "Content-Type: application/json" \
            -H "X-CI-Token: $CI_PUBLISH_TOKEN" \
            -d "$BODY"
          echo "Published admin_latest_version=$VER"
