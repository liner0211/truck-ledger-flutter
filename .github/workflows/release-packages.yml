name: Release Packages

# 统一构建 Android APK + iOS（Runner.app / ipa / deb），并写入 GitHub Releases。
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "lib/**"
      - "android/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "package_deb.sh"
      - "package_ipa.sh"
      - "control"
      - ".github/workflows/release-packages.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version_name: ${{ steps.ver.outputs.name }}
      version_code: ${{ steps.ver.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          source ./scripts/flutter_build_version_env.sh
          echo "name=$APP_BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$APP_BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Resolved $APP_BUILD_NAME+$APP_BUILD_NUMBER"

      - name: Pub Get
        run: flutter pub get

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 not set; release APK will use debug signing."
            exit 0
          fi
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/upload-keystore.jks
          {
            echo "storePassword=${ANDROID_STORE_PASSWORD}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=../keystore/upload-keystore.jks"
          } > android/key.properties
          echo "Release signing configured."

      - name: Build Release APK
        run: |
          set -euo pipefail
          source ./scripts/flutter_build_version_env.sh
          flutter build apk --release \
            --build-name="$APP_BUILD_NAME" \
            --build-number="$APP_BUILD_NUMBER"
          mkdir -p dist
          cp -f build/app/outputs/flutter-apk/app-release.apk \
            "dist/truckledger-${APP_BUILD_NAME}-${APP_BUILD_NUMBER}-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          retention-days: 30

  build-ios:
    runs-on: macos-15
    timeout-minutes: 50
    outputs:
      version_name: ${{ steps.ver.outputs.name }}
      version_code: ${{ steps.ver.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          source ./scripts/flutter_build_version_env.sh
          echo "name=$APP_BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$APP_BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Resolved $APP_BUILD_NAME+$APP_BUILD_NUMBER"

      - name: Install dpkg (for deb)
        run: brew install dpkg

      - name: Pub Get
        run: flutter pub get

      - name: Build iOS Runner.app (no codesign)
        run: ./scripts/flutter_build_ios_release.sh

      - name: Package IPA + DEB + Runner.zip
        run: |
          set -euo pipefail
          source ./scripts/flutter_build_version_env.sh
          test -d build/ios/iphoneos/Runner.app

          SKIP_BUILD=1 ./package_ipa.sh
          SKIP_BUILD=1 ./package_deb.sh

          mkdir -p dist
          # Runner.app.zip（兼容旧一键脚本）
          (
            cd build/ios/iphoneos
            ditto -c -k --sequesterRsrc --keepParent Runner.app \
              "$GITHUB_WORKSPACE/dist/Runner.app.zip"
          )
          cp -f ipa-out/Runner.ipa \
            "dist/truckledger-${APP_BUILD_NAME}-${APP_BUILD_NUMBER}.ipa"
          DEB_SRC="$(ls -1 packages/com.liner0211.truckledger_*.deb | head -1)"
          cp -f "$DEB_SRC" \
            "dist/com.liner0211.truckledger_${APP_BUILD_NAME}-${APP_BUILD_NUMBER}_iphoneos-arm64e.deb"
          ls -lh dist/

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-packages
          path: |
            dist/Runner.app.zip
            dist/*.ipa
            dist/*.deb
          retention-days: 30

  github-release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download iOS packages
        uses: actions/download-artifact@v4
        with:
          name: ios-packages
          path: release-assets

      - name: Prepare release metadata
        id: meta
        run: |
          set -euo pipefail
          source ./scripts/flutter_build_version_env.sh
          TAG="v${APP_BUILD_NAME}-${APP_BUILD_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=卡车记账 ${APP_BUILD_NAME} (${APP_BUILD_NUMBER})" >> "$GITHUB_OUTPUT"
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "## 卡车记账 ${APP_BUILD_NAME}+${APP_BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_OUTPUT"
          echo "- Android: Release APK" >> "$GITHUB_OUTPUT"
          echo "- iOS 更新包: IPA（控制面 ios_download_url）" >> "$GITHUB_OUTPUT"
          echo "- 越狱可选: DEB + Runner.app.zip" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "应用内更新请用 IPA；DEB 仅供越狱 \`dpkg -i\`。" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          # 展平子目录，保证 Releases 挂上全部安装包
          find release-assets -mindepth 2 -type f -exec mv -t release-assets/ {} + 2>/dev/null || true
          find release-assets -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          ls -lh release-assets/
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -ge 1

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: ${{ steps.meta.outputs.body }}
          draft: false
          prerelease: false
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-control-plane:
    needs: [build-android, build-ios, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download iOS packages
        uses: actions/download-artifact@v4
        with:
          name: ios-packages
          path: release-assets

      - name: Upload packages + publish version to control plane
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          CI_PUBLISH_TOKEN: ${{ secrets.CI_PUBLISH_TOKEN }}
          FORCE_UPDATE_ON_RELEASE: ${{ secrets.FORCE_UPDATE_ON_RELEASE }}
          VERSION_NAME: ${{ needs.build-android.outputs.version_name }}
          VERSION_CODE: ${{ needs.build-android.outputs.version_code }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER_SSH_KEY:-}" ] || [ -z "${CI_PUBLISH_TOKEN:-}" ] || [ -z "${SERVER_HOST:-}" ]; then
            echo "缺少 SERVER_SSH_KEY / CI_PUBLISH_TOKEN / SERVER_HOST，跳过控制面版本发布。"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          SERVER_HOST="$(printf '%s' "${SERVER_HOST:-}" | tr -d '\r\n')"
          USER="$(printf '%s' "${SERVER_USER:-root}" | tr -d '\r\n')"
          PORT="$(printf '%s' "${SERVER_PORT:-22}" | tr -d '\r\n')"
          PATH_ROOT="$(printf '%s' "${SERVER_PATH:-/www/wwwroot/truck.liner0211.online}" | tr -d '\r\n')"
          BASE="$(printf '%s' "${PUBLIC_BASE_URL:-https://truck.liner0211.online}" | tr -d '\r\n')"
          BASE="${BASE%/}"
          SSH=(ssh -i "$HOME/.ssh/deploy_key" -p "$PORT" -o StrictHostKeyChecking=accept-new)
          SCP=(scp -i "$HOME/.ssh/deploy_key" -P "$PORT" -o StrictHostKeyChecking=accept-new)

          APK=$(ls -1 release-assets/*.apk | head -1)
          IPA=$(ls -1 release-assets/*.ipa 2>/dev/null | head -1 || true)
          DEB=$(ls -1 release-assets/*.deb 2>/dev/null | head -1 || true)
          test -f "$APK"
          if [[ -z "${IPA:-}" || ! -f "$IPA" ]]; then
            echo "ERROR: 缺少 IPA，无法同步 iOS 更新地址到服务器" >&2
            ls -la release-assets/ >&2 || true
            exit 1
          fi

          "${SSH[@]}" "${USER}@${SERVER_HOST}" "mkdir -p '${PATH_ROOT}/public/downloads'"
          "${SCP[@]}" "$APK" "${USER}@${SERVER_HOST}:${PATH_ROOT}/public/downloads/truckledger-latest.apk"
          "${SCP[@]}" "$APK" "${USER}@${SERVER_HOST}:${PATH_ROOT}/public/downloads/truckledger-${VERSION_NAME}-${VERSION_CODE}.apk"
          "${SCP[@]}" "$IPA" "${USER}@${SERVER_HOST}:${PATH_ROOT}/public/downloads/truckledger-latest.ipa"
          "${SCP[@]}" "$IPA" "${USER}@${SERVER_HOST}:${PATH_ROOT}/public/downloads/truckledger-${VERSION_NAME}-${VERSION_CODE}.ipa"
          # deb 仍上传供越狱一键安装，但不写入 ios_download_url
          if [[ -n "${DEB:-}" && -f "$DEB" ]]; then
            "${SCP[@]}" "$DEB" "${USER}@${SERVER_HOST}:${PATH_ROOT}/public/downloads/truckledger-latest.deb"
            "${SCP[@]}" "$DEB" "${USER}@${SERVER_HOST}:${PATH_ROOT}/public/downloads/truckledger-${VERSION_NAME}-${VERSION_CODE}.deb"
          fi
          "${SSH[@]}" "${USER}@${SERVER_HOST}" "if id www >/dev/null 2>&1; then chown -R www:www '${PATH_ROOT}/public/downloads' || true; chmod -R a+rX '${PATH_ROOT}/public/downloads' || true; fi"

          # 控制面版本含构建号，与客户端 package 的 version+buildNumber 对齐，保证发版后能提示更新
          FULL_VERSION="${VERSION_NAME}+${VERSION_CODE}"
          APK_URL="${BASE}/downloads/truckledger-latest.apk"
          IOS_URL="${BASE}/downloads/truckledger-latest.ipa"
          NOTES="自动发布 ${FULL_VERSION}（${GITHUB_SHA::7}）"
          FORCE="${FORCE_UPDATE_ON_RELEASE:-0}"
          if [[ "$FORCE" != "1" ]]; then FORCE=0; fi

          BODY=$(jq -n \
            --arg v "$FULL_VERSION" \
            --arg apk "$APK_URL" \
            --arg ios "$IOS_URL" \
            --arg notes "$NOTES" \
            --arg force "$FORCE" \
            '{
              latest_version: $v,
              apk_download_url: $apk,
              ios_download_url: $ios,
              update_release_notes: $notes,
              force_update: $force
            }')

          curl -fsS -X POST "${BASE}/api/ci/publish-release" \
            -H "Content-Type: application/json" \
            -H "X-CI-Token: ${CI_PUBLISH_TOKEN}" \
            -d "$BODY"

          echo
          echo "Published latest_version=$FULL_VERSION apk=$APK_URL ios=$IOS_URL force=$FORCE"
          # 校验 downloads 可访问
          curl -fsSI "$APK_URL" | head -n 1
          curl -fsSI "$IOS_URL" | head -n 1
