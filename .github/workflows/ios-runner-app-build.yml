name: iOS Runner.app Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "lib/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios-runner-app-build.yml"

jobs:
  build-ios-runner-app:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Version
        run: flutter --version

      - name: Pub Get
        run: flutter pub get

      - name: Build iOS Runner.app (no codesign)
        run: ./scripts/flutter_build_ios_release.sh

      - name: Prepare Artifact
        run: |
          test -d build/ios/iphoneos/Runner.app
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Runner.app Runner.app.zip

      - name: Upload Runner.app Zip
        uses: actions/upload-artifact@v4
        with:
          name: runner-app-ios
          path: build/ios/iphoneos/Runner.app.zip
          retention-days: 14
