name: iOS Runner.app Build

# Standard Flutter iOS (Xcode)，no Theos。
# 单平台手动构建：flutter build ios → IPA（主）+ 可选 DEB；日常请用 Release Packages。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-runner-app:
    runs-on: macos-15
    timeout-minutes: 50
    outputs:
      version_name: ${{ steps.ver.outputs.name }}
      version_code: ${{ steps.ver.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          source ./scripts/flutter_build_version_env.sh
          echo "name=$APP_BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$APP_BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Install dpkg (for deb)
        run: brew install dpkg

      - name: Pub Get
        run: flutter pub get

      # Standard Flutter iOS (Xcode)，no Theos
      - name: Build iOS Runner.app (no codesign)
        run: ./scripts/flutter_build_ios_release.sh

      - name: Package IPA + optional DEB + Runner.zip
        run: |
          set -euo pipefail
          source ./scripts/flutter_build_version_env.sh
          test -d build/ios/iphoneos/Runner.app
          SKIP_BUILD=1 ./package_ipa.sh
          SKIP_BUILD=1 ./package_deb.sh
          mkdir -p dist
          (
            cd build/ios/iphoneos
            ditto -c -k --sequesterRsrc --keepParent Runner.app \
              "$GITHUB_WORKSPACE/dist/Runner.app.zip"
          )
          cp -f ipa-out/Runner.ipa "dist/truckledger-${APP_BUILD_NAME}-${APP_BUILD_NUMBER}.ipa"
          DEB_SRC="$(ls -1 packages/com.liner0211.truckledger_*.deb | head -1)"
          cp -f "$DEB_SRC" \
            "dist/com.liner0211.truckledger_${APP_BUILD_NAME}-${APP_BUILD_NUMBER}_iphoneos-arm64e.deb"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ios-packages
          path: |
            dist/Runner.app.zip
            dist/*.ipa
            dist/*.deb
          retention-days: 30

  github-release:
    needs: [build-ios-runner-app]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-packages
          path: release-assets
      - name: Meta
        id: meta
        run: |
          set -euo pipefail
          source ./scripts/flutter_build_version_env.sh
          echo "tag=ios-v${APP_BUILD_NAME}-${APP_BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "name=卡车记账 iOS ${APP_BUILD_NAME} (${APP_BUILD_NUMBER})" >> "$GITHUB_OUTPUT"
          find release-assets -type f -ls
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            ## iOS IPA / DEB / Runner.app.zip（手动 workflow）
            - Commit: `${{ github.sha }}`
          files: release-assets/**
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
